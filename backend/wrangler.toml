name = "aletheia"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Set secrets with:
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put FIRECRAWL_API_KEY
#   npx wrangler secret put TAVILY_API_KEY
[vars]
OPENAI_BASE_URL = "https://api.reflection.ai/openai/v1"
OPENAI_MODEL = "Beam-501B-A23B"
ALLOWED_ORIGINS = "https://hellenicdev.eu,https://www.hellenicdev.eu,https://hellenicdev.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8787,http://127.0.0.1:8787"
RATE_LIMIT_PER_IP = "30"
RATE_LIMIT_WINDOW_SEC = "600"
# Each non-cached analysis reserves 12 Tavily credits. A new analysis is
# refused when the next reservation would pass either cap.
TAVILY_DAILY_CREDITS = "120"
TAVILY_MONTHLY_CREDITS = "950"
# The mention cron is installed but does nothing until X_BOT_ENABLED is "true"
# and the X secrets below are set. Cap 0 still allows cache-hit replies only.
X_BOT_ENABLED = "false"
X_BOT_DAILY_CAP = "0"
X_BOT_PER_USER_DAILY = "3"
X_BOT_MAX_REPLIES_DAILY = "30"
X_BOT_USER_ID = "2115409689869475840"
X_BOT_HANDLE = "aletheia_bot"

[triggers]
crons = ["*/2 * * * *"]

# The binding's period can only be 10 or 60 seconds, so this is a 3-per-minute
# edge guard. Its key is the IPv4 address or the IPv6 /64. The 10-minute, daily,
# and in-flight limits are one Durable Object per that same key. Tavily credits
# and the site-wide cap (6 fresh analyses per minute, 2 in flight) share one
# global Durable Object. The result cache is a third. All three are top-level:
# this worker has no [env.*] target, and Workers Builds deploys the top-level config.
# The site-wide cap is stored on TavilyCredits so this file does not add a
# migration. The X bot cursor, reply ids, per-user counts, and denylist use
# the same object (storage key `xbot`). `wrangler versions upload` rejects a
# pending migration.
[[ratelimits]]
name = "ANALYZE_IP"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[durable_objects.bindings]]
name = "IP_LIMITER"
class_name = "IpRateLimiter"

[[durable_objects.bindings]]
name = "TAVILY_CREDITS"
class_name = "TavilyCredits"

[[durable_objects.bindings]]
name = "PIPELINE_CACHE"
class_name = "PipelineCache"

# `wrangler versions upload` cannot apply this first migration. `wrangler deploy`
# can. Once tag v1 is on the deployed script, later uploads of the same tag succeed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpRateLimiter", "TavilyCredits", "PipelineCache"]
